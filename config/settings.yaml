# All run settings. Python reads this; nothing here is a secret.
inbox: chief.geek@agentmail.to
# Guy's checklist item 1: until he confirms the address, leave this empty and mode at dry-run.
# guards.py refuses any send while recipient is empty.
recipient: ""
mode: dry-run            # dry-run | test | scheduled
subject_prefix: "[TEST] "   # dropped at Phase 2 sign-off
timezone: Europe/Athens
run_time: "06:11"
check_time: "09:40"
first_cutoff_time: "06:00"   # first run: previous Monday at this Athens time

thresholds:
  early_stages: [pre_seed, seed, series_a]
  # A round whose stage no source states counts as early only below this size (shown as "stage not stated").
  unstated_stage_early_max_usd: 25000000
  big_round_usd: 50000000        # block 3 rows; also the block-2 area-table cap
  mega_round_usd: 100000000      # the worldwide "N rounds of $100M or more" line
  block3_max_rows: 8
  block3_talks_max: 4
  # Softer wordings that may be shown in place of the plain status. Anything else an extractor writes is ignored.
  status_notes: [considering, exploring, early talks, advanced talks, being finalised, first tranche]
  block4_single_full_max: 6     # single-source deals shown in full; any more are named on one line
  dots_cap: 5
  confirmed_min_families: 2      # block 4: confirmed acquisition
  notable_team_min_families: 3
  family_dominance_flag: 0.25    # flag a count if dropping one family moves it by more than this
  merge_window_days: 10
  merge_amount_tolerance: 0.15   # relative, after conversion to USD
  min_weeks_for_trends: 8
  words_min: 500
  words_max: 850
  html_max_bytes: 40000
  quote_max_chars: 300

budgets:
  usual_issues_seed: [55, 55, 54]   # W45-W47; usual = median of recent weeks
  min_issue_share: 0.5
  max_issues: 90
  max_extract_fail_share: 0.10
  max_factcheck_fail_share: 0.20
  max_wall_minutes: 45
  max_agents_over_issues: 15
  max_factcheck_reopens: 80
  extract_parallel: 10

# Currency: amounts are shown in the original currency. These rates are used only to compare
# against USD thresholds and for medians; every use is logged in blocks.json (pitfall 13).
fx:
  as_of: "2026-11-20"
  source: "fixed table, reviewed monthly with the price check"
  usd_per: {USD: 1.0, EUR: 1.08, GBP: 1.27, CHF: 1.13, SEK: 0.095, DKK: 0.145, NOK: 0.093, PLN: 0.25, CAD: 0.72, AUD: 0.65, INR: 0.0118, JPY: 0.0065, CNY: 0.138, KRW: 0.00072, ILS: 0.27, SGD: 0.75}

europe_countries: [AL, AD, AT, BY, BE, BA, BG, HR, CY, CZ, DK, EE, FI, FR, DE, GR, HU, IS, IE, IT, XK, LV, LI, LT, LU, MT, MD, MC, ME, NL, MK, NO, PL, PT, RO, SM, RS, SK, SI, ES, SE, CH, UA, GB, VA]
